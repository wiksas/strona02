# Buduje stronę z content/*.json i publikuje ją na GitHub Pages.
# Uruchamia się po każdym commicie na main (także z panelu /admin), ręcznie
# oraz codziennie w nocy — żeby z programu znikały koncerty, które już się odbyły.
#
# Własna domena: ustaw zmienną repozytorium CUSTOM_DOMAIN (Settings → Secrets and variables →
# Actions → Variables), np. harris.krakow.pl. Bez niej strona działa pod https://<konto>.github.io/<repo>/.
name: Budowanie i publikacja

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # bez własnej domeny strona działa pod /<repo>/, z własną domeną — od katalogu głównego
      BASE_PATH: ${{ vars.CUSTOM_DOMAIN == '' && format('/{0}', github.event.repository.name) || '' }}
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Plik CNAME dla własnej domeny
        if: ${{ vars.CUSTOM_DOMAIN }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > build/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
